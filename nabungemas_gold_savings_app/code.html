<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .splash-gradient {
            background: linear-gradient(135deg, #F5B93A 0%, #F7CA6A 100%);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }
        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background antialiased overflow-hidden">
<!-- Main Canvas 390x844 -->
<main class="relative w-full h-screen max-w-[390px] mx-auto overflow-hidden splash-gradient flex flex-col items-center justify-center">
<!-- Atmospheric Background Elements -->
<div class="absolute inset-0 opacity-10 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-white rounded-full blur-3xl"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-80 h-80 bg-white rounded-full blur-3xl"></div>
</div>
<!-- Logo Container -->
<div class="relative z-10 flex flex-col items-center justify-center fade-in">
<!-- Icon Cluster -->
<div class="mb-6 flex items-center justify-center bg-white/20 backdrop-blur-md p-6 rounded-full shadow-xl float-animation border border-white/30">
<div class="relative w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary text-[48px]" data-icon="savings" style="font-variation-settings: 'FILL' 1;">
                        savings
                    </span>
<!-- Sprout Overlay -->
<div class="absolute -top-1 -right-1 bg-success p-1.5 rounded-full border-2 border-white shadow-sm">
<span class="material-symbols-outlined text-white text-[16px]" data-icon="eco" style="font-variation-settings: 'FILL' 1;">
                            eco
                        </span>
</div>
</div>
</div>
<!-- Brand Name -->
<div class="text-center">
<h1 class="font-display-lg text-display-lg text-white tracking-tight drop-shadow-sm mb-2">
                    NabungEmas
                </h1>
<p class="font-body-lg text-body-lg italic text-white/90 font-medium tracking-wide">
                    Kelola target, raih impianmu
                </p>
</div>
</div>
<!-- Subtle Loading Indicator or Decorative Base -->
<div class="absolute bottom-16 flex flex-col items-center fade-in" style="animation-delay: 0.5s;">
<div class="w-1.5 h-1.5 bg-white/60 rounded-full animate-bounce"></div>
<div class="mt-8">
<div class="w-32 h-1 bg-white/20 rounded-full overflow-hidden">
<div class="h-full bg-white w-1/3 rounded-full animate-[progress_2s_ease-in-out_infinite]"></div>
</div>
</div>
</div>

<script>
        // Micro-interaction for the progress bar animation
        document.head.insertAdjacentHTML('beforeend', `
            <style>
                @keyframes progress {
                    0% { transform: translateX(-100%); }
                    50% { transform: translateX(100%); }
                    100% { transform: translateX(-100%); }
                }
            </style>
        `);

        // Handle splash screen timeout simulation
        document.addEventListener('DOMContentLoaded', () => {
