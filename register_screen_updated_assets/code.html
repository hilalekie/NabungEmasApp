<body class="bg-bg-light font-body-lg text-on-surface min-h-screen">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-padding-page h-16 w-full fixed top-0 z-50 bg-surface">
<div class="flex items-center gap-4">

</div>

</header>
<main class="pb-12 px-padding-page max-w-md mx-auto pt-24">
<!-- Center Content -->
<div class="flex flex-col items-center mb-8">
<!-- Avatar with Badge -->

<h2 class="font-headline-lg text-headline-lg text-on-surface mb-4">Buat Akun Baru</h2>
</div>
<!-- Registration Form -->
<form class="space-y-4" onsubmit="return false;">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant ml-1 mb-2">Nama Lengkap</label>

</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant ml-1 mb-2">Email</label>
<input class="w-full h-[52px] px-4 rounded-xl border border-outline bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" placeholder="contoh@email.com" type="email">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant ml-1 mb-2">Nomor HP</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">+62</span>
<input class="w-full h-[52px] pl-14 pr-4 rounded-xl border border-outline bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" placeholder="812xxxx" type="tel">
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant ml-1 mb-2">Kata Sandi</label>
<div class="relative">
<input class="w-full h-[52px] px-4 rounded-xl border border-outline bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" placeholder="••••••••" type="password">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer" data-icon="visibility">visibility</span>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant ml-1 mb-2">Konfirmasi Sandi</label>
<div class="relative">
<input class="w-full h-[52px] px-4 rounded-xl border border-outline bg-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" placeholder="••••••••" type="password">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer" data-icon="visibility_off">visibility_off</span>
</div>
</div>
</div>
<!-- T&C Checkbox -->
<div class="flex items-start gap-3 py-2">
<input class="mt-1 w-5 h-5 rounded border-outline text-primary focus:ring-primary cursor-pointer" id="terms" type="checkbox">
<label class="font-label-md text-label-md text-on-surface-variant leading-relaxed" for="terms">
          Saya setuju dengan <a class="text-primary font-bold" href="#">Syarat &amp; Ketentuan</a> serta <a class="text-primary font-bold" href="#">Kebijakan Privasi</a> yang berlaku.
        </label>
</div>

<button class="w-full h-[52px] rounded-full gold-gradient text-white font-bold text-body-lg custom-shadow active:scale-95 transition-transform duration-150 mt-4">

<!-- Bottom Nav Logic: Suppressed because this is a Transactional/Focused screen -->
<script>
    // Simple micro-interactions for password visibility
    document.querySelectorAll('[data-icon^="visibility"]').forEach(icon => {
      icon.addEventListener('click', function() {
        const input = this.previousElementSibling;
        if (input.type === 'password') {
          input.type = 'text';
          this.innerText = 'visibility_off';
        } else {
          input.type = 'password';
          this.innerText = 'visibility';
        }
      });
    });
  </script>
